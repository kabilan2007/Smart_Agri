name: smart_agri
description: Smart Agri - Intelligent Agricultural Assistant for Modern & Young Farmers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & Network
  provider: ^6.1.1
  http: ^1.2.0

  # Hardware, Location & Media
  geolocator: ^14.0.0
  geocoding: ^3.0.0
  image_picker: ^1.0.7

  # Voice: STT & TTS
  flutter_tts: ^4.0.2
  speech_to_text: ^7.0.0

  # UI, Fonts & Styling
  google_fonts: ^6.1.0
  intl: 0.20.2
  flutter_markdown: ^0.6.18+4
  cached_network_image: ^3.3.1
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
